<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- App Background (Rounded squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Calendar Page Base -->
  <rect x="76" y="110" width="360" height="320" rx="36" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Calendar Header Red/Gold Band -->
  <path d="M 76 146 Q 76 110 112 110 L 400 110 Q 436 110 436 146 L 436 190 L 76 190 Z" fill="#dc2626" />
  
  <!-- Calendar Rings / Clips -->
  <rect x="140" y="80" width="24" height="60" rx="12" fill="#f8fafc" stroke="#d97706" stroke-width="4" />
  <rect x="348" y="80" width="24" height="60" rx="12" fill="#f8fafc" stroke="#d97706" stroke-width="4" />
  
  <!-- Lao Flower Dok Champa in Center -->
  <g transform="translate(256, 305) scale(1.1)">
    <!-- 5 Petals -->
    <path d="M 0 0 C -25 -45 -15 -90 0 -95 C 15 -90 25 -45 0 0 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
    <path d="M 0 0 C -25 -45 -15 -90 0 -95 C 15 -90 25 -45 0 0 Z" transform="rotate(72)" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
    <path d="M 0 0 C -25 -45 -15 -90 0 -95 C 15 -90 25 -45 0 0 Z" transform="rotate(144)" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
    <path d="M 0 0 C -25 -45 -15 -90 0 -95 C 15 -90 25 -45 0 0 Z" transform="rotate(216)" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
    <path d="M 0 0 C -25 -45 -15 -90 0 -95 C 15 -90 25 -45 0 0 Z" transform="rotate(288)" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
    <!-- Center Yellow Heart -->
    <circle cx="0" cy="0" r="26" fill="#f59e0b" />
    <circle cx="0" cy="0" r="14" fill="#fbbf24" />
  </g>
  
  <!-- Text Label "LAO" or Year -->
  <text x="256" y="165" fill="#ffffff" font-family="'Noto Sans Lao', sans-serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="2">ປະຕິທິນລາວ</text>
  <text x="256" y="395" fill="#b45309" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle">2026 • 2569</text>
</svg>
