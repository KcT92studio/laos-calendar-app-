    <script>
      // Prevent browser pull-to-refresh on mobile while preserving smooth in-page scrolling
      (function() {
        var startY = 0;
        window.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length === 1) {
            startY = e.touches[0].clientY;
          }
        }, { passive: true });

        window.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length === 1) {
            var currentY = e.touches[0].clientY;
            // When user is at the top of the window and pulls downward
            if (window.scrollY <= 0 && currentY > startY) {
              if (e.cancelable) {
                e.preventDefault();
              }
            }
          }
        }, { passive: false });
      })();
    </script>
